name: DemucsDeviceHarness
options:
  deploymentTarget:
    iOS: '27.0'
  createIntermediateGroups: true
packages:
  Demucs:
    path: ../..
targets:
  DemucsDeviceHarness:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: ../../.build/iOSAssets
        type: folder
        buildPhase: resources
    dependencies:
      - package: Demucs
        product: DemucsMLX
      - package: Demucs
        product: DemucsAudio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.demucsmlx.deviceharness
        SWIFT_VERSION: '6.0'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: '1,2'
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        SWIFT_STRICT_CONCURRENCY: complete
schemes:
  DemucsDeviceHarness:
    build:
      targets:
        DemucsDeviceHarness: all
    run:
      config: Release
